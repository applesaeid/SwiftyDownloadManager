
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - '0.6.0'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 0.6.0

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install tools and dependencies
        run: |
          mise install
          mise exec -- tuist install
          mise exec -- tuist generate --no-open

      - name: Build iOS app
        run: |
          xcodebuild build \
            -workspace SDM.xcworkspace \
            -scheme SDMApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r SwiftyDownloadManager.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyDownloadManager-IPA
          path: SwiftyDownloadManager.ipa
